[package]
name        = "lsp-mcpp"
version     = "0.1.0"
description = "Compiler-agnostic C++ modules language server"
license     = "Apache-2.0"
authors     = ["mcpp community"]
repo        = "https://github.com/Sunrisepeak/lsp-mcpp-private"

[build]
sources = ["src/**/*.cppm", "src/**/*.cpp"]

# Four executables share every module under src/.
[targets.lsp-mcpp]
kind = "bin"
main = "src/main.cpp"

[targets.lsp-mcpp-conformance]
kind = "bin"
main = "src/tools/conformance.cpp"

[targets.lsp-mcpp-lspgen]
kind = "bin"
main = "src/tools/lspgen.cpp"

# Stands in for mcpp in conformance fixtures: the build-database contract of mcpp-community/mcpp#636.
[targets.lsp-mcpp-mock-mcpp]
kind = "bin"
main = "src/tools/mockmcpp.cpp"

[toolchain]
default = "llvm@22.1.8"

# The platform: openkal beneath musl, libc++ above it. One source builds every target.
[dependencies]
openkal-llvm-runtime = "0.9.5"
cmdline              = "0.0.2"

[dependencies.nlohmann]
json = "3.12.0"

[dev-dependencies]
lsp-mcpp-testing = { path = "testing" }

# Platform facts are a package chosen by the target, consumed with `if constexpr`.
[target.'cfg(os = "linux")'.dependencies]
lsp-mcpp-os-linux = { path = "os/linux" }

[target.'cfg(os = "macos")'.dependencies]
lsp-mcpp-os-macos = { path = "os/macos" }

[target.'cfg(windows)'.dependencies]
lsp-mcpp-os-windows = { path = "os/windows" }
