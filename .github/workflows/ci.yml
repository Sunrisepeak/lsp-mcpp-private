name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MCPP_VERSION: 2026.9.14.1
  LLVM_VERSION: 22.1.8
  XLINGS_VERSION: v2026.8.17.2
  XLINGS_NON_INTERACTIVE: '1'
  PAYLOAD_CACHE: ${{ github.workspace }}/.payload-cache

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests on each host, and every executable starts.
  build-test:
    name: build and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: '' }
          # A macOS host resolves the Apple-native triple by default; openkal's
          # macOS implementation is reached through aarch64-macos.
          - { os: macos-14, target: '--target aarch64-macos' }
          # A Windows host defaults to the MSVC target; openkal's Windows
          # implementation is reached through the GNU target.
          - { os: windows-2022, target: '--target x86_64-windows-gnu' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mcpp
      - name: Build
        run: mcpp build ${{ matrix.target }}
      - name: Executables run
        run: |
          set -euo pipefail
          for exe in lsp-mcpp lsp-mcpp-conformance lsp-mcpp-lspgen; do
            path=$(find target -type f \( -name "$exe" -o -name "$exe.exe" \) -path '*/bin/*' | head -1)
            echo "$exe -> $path"
            "$path" version
          done
      - name: Unit tests
        run: mcpp test ${{ matrix.target }}
      # The payloads ship release builds, and every release-only defect found so
      # far (design 12.9, K7 and K13) was invisible to the dev profile.
      - name: Unit tests (release)
        run: mcpp test --profile release ${{ matrix.target }}
      - name: Generated protocol is fresh
        if: runner.os == 'Linux'
        run: |
          mcpp run lsp-mcpp-lspgen -- generate --meta-model tools/lspgen/metaModel-3.18.json --out src/lsp
          git diff --exit-code src/lsp

  # ---------------------------------------------------------------------------
  # One Linux host builds the server for every platform (design 12.4).
  cross-build:
    name: cross-build from Linux (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-windows-gnu, aarch64-macos]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mcpp
      - name: Build for ${{ matrix.target }}
        run: mcpp build --target ${{ matrix.target }}
      - name: Artifacts have the expected format
        run: |
          set -euo pipefail
          for exe in lsp-mcpp lsp-mcpp-conformance lsp-mcpp-lspgen; do
            path=$(find target -type f \( -name "$exe" -o -name "$exe.exe" \) -path '*/bin/*' | head -1)
            file "$path"
            case "${{ matrix.target }}" in
              *windows*) file "$path" | grep -q 'PE32+ executable' ;;
              *macos*)   file "$path" | grep -q 'Mach-O 64-bit arm64' ;;
            esac
          done

  # ---------------------------------------------------------------------------
  # Payloads: the server, trimmed clangd 23.1 and the lsp-mcpp-kit (design 15.2).
  # linux-x64 and win32-x64 are assembled on Linux (the Windows server is
  # cross-built); darwin-arm64 needs a macOS host for lipo and the libc++ configure.
  payload:
    name: payload (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-24.04, target: '',                              exe: '' }
          - { platform: win32-x64,    os: ubuntu-24.04, target: '--target x86_64-windows-gnu',   exe: '.exe' }
          - { platform: darwin-arm64, os: macos-14,     target: '--target aarch64-macos',        exe: '' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mcpp
      - name: Build tools for the kit configure
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q ninja-build; fi
          if [ "$RUNNER_OS" = macOS ]; then brew install ninja; fi
          cmake --version | head -1; ninja --version
      - name: Cache upstream inputs
        uses: actions/cache@v4
        with:
          path: .payload-cache
          key: payload-inputs-${{ matrix.platform }}-${{ hashFiles('packaging/payload.lock.json') }}
      # Release builds: openkal-llvm-runtime 0.9.5 carries the fixes for the two
      # release-only defects beneath the server (design 12.9, K7 and K13).
      - name: Build the server
        run: mcpp build --profile release ${{ matrix.target }}
      - name: Trim clangd
        run: python3 packaging/scripts/trim_clangd.py --platform ${{ matrix.platform }} --out work/clangd --cache "$PAYLOAD_CACHE"
      - name: Build the semantic kit
        run: python3 packaging/scripts/build_kit.py --platform ${{ matrix.platform }} --out work/kit --cache "$PAYLOAD_CACHE" --work work/kit-build
      - name: Assemble
        run: |
          set -euo pipefail
          server=$(find target -type f -name "lsp-mcpp${{ matrix.exe }}" -path '*/bin/*' | head -1)
          runner=$(find target -type f -name "lsp-mcpp-conformance${{ matrix.exe }}" -path '*/bin/*' | head -1)
          python3 packaging/scripts/assemble_payload.py --platform ${{ matrix.platform }} --server "$server" \
              --clangd work/clangd --kit work/kit --out payload
          python3 packaging/scripts/assemble_payload.py --verify payload
          mkdir -p tools && cp "$runner" tools/
          # A tarball keeps executable bits and links, which an artifact zip does not.
          tar -czf payload-${{ matrix.platform }}.tar.gz payload tools
          du -sh payload payload-${{ matrix.platform }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: payload-${{ matrix.platform }}
          path: payload-${{ matrix.platform }}.tar.gz
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The specifications' executable part, against real toolchains (conformance/README.md).
  conformance:
    name: conformance (${{ matrix.platform }})
    needs: payload
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            fixtures: inferred untrusted mcpp-gcc mcpp-llvm mingw cmake-clang
          - platform: darwin-arm64
            os: macos-14
            fixtures: inferred untrusted mcpp-llvm
          - platform: win32-x64
            os: windows-2022
            fixtures: inferred inferred-msvc untrusted mingw cmake-msvc cmake-msvc-std cmake-clangxx-msvc compdb-clangxx-msvc-std compdb-clang-cl-std mcpp-msvc mcpp-llvm-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mcpp
      - name: Toolchains the fixtures build with
        run: |
          set -euo pipefail
          case " ${{ matrix.fixtures }} " in *" mcpp-gcc "*|*" mingw "*) mcpp toolchain install gcc 16.1.0 ;; esac
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q ninja-build; fi
      # The MSVC fixtures build inside a developer environment; the server under test
      # runs without one, as it does when an editor starts it (usable plan D30).
      - name: The MSVC developer environment, for the fixtures' own builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Set-Content -Path "$env:RUNNER_TEMP\capture-msvc.cmd" -Value "@call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul`r`n@set"
          cmd /d /c "$env:RUNNER_TEMP\capture-msvc.cmd" | Out-File -Encoding utf8 "$env:RUNNER_TEMP\msvc.env"
          Select-String -Path "$env:RUNNER_TEMP\msvc.env" -Pattern '^(VCToolsInstallDir|WindowsSDKVersion)='
      - uses: actions/download-artifact@v4
        with:
          name: payload-${{ matrix.platform }}
      - name: Unpack the payload
        run: tar -xzf payload-${{ matrix.platform }}.tar.gz && ls payload tools
      - name: Run the fixtures
        env:
          CONFORMANCE_CLANGXX: ${{ runner.os == 'Linux' && '~/.mcpp/registry/data/xpkgs/xim-x-llvm/22.1.8/bin/clang++' || '' }}
        run: |
          set -euo pipefail
          export CONFORMANCE_CLANGXX="${CONFORMANCE_CLANGXX/#\~/$HOME}"
          exe=''; extra=()
          if [ "$RUNNER_OS" = Windows ]; then exe='.exe'; extra=(--msvc-env "$RUNNER_TEMP/msvc.env"); fi
          failed=''
          for fixture in ${{ matrix.fixtures }}; do
            echo "::group::$fixture"
            if ! "tools/lsp-mcpp-conformance$exe" run --server "payload/bin/lsp-mcpp$exe" --payload payload "${extra[@]}" \
                   --fixture "conformance/fixtures/$fixture" --timeout 180; then
              failed="$failed $fixture"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed fixtures:$failed"
            # Rerun the first failure with the server's log, for the record.
            first=${failed# }; first=${first%% *}
            "tools/lsp-mcpp-conformance$exe" run --server "payload/bin/lsp-mcpp$exe" --payload payload "${extra[@]}" \
                --fixture "conformance/fixtures/$first" --timeout 60 --verbose 2>&1 | tail -200 || true
            exit 1
          fi

      # A workspace reached through a symbolic link, which is where every macOS
      # temporary directory is (/var is /private/var): mcpp names files by their
      # resolved path, and an unsaved edit must still reach the modules that
      # import it (check C7).
      - name: A workspace reached through a symbolic link
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/real"
          ln -sfn "$RUNNER_TEMP/real" "$RUNNER_TEMP/link"
          TMPDIR="$RUNNER_TEMP/link" tools/lsp-mcpp-conformance run --server payload/bin/lsp-mcpp --payload payload \
              --fixture conformance/fixtures/mcpp-llvm --timeout 180

  # ---------------------------------------------------------------------------
  # VS Code → extension → lsp-mcpp → clangd, and the platform VSIX (design 16).
  vscode-e2e:
    name: VS Code end to end (${{ matrix.platform }})
    needs: payload
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-24.04 }
          - { platform: darwin-arm64, os: macos-14 }
          - { platform: win32-x64,    os: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: payload-${{ matrix.platform }}
      - name: Put the payload into the extension
        run: |
          set -euo pipefail
          tar -xzf payload-${{ matrix.platform }}.tar.gz
          rm -rf editors/vscode/payload && mv payload editors/vscode/payload
      - name: Install and compile
        working-directory: editors/vscode
        run: npm ci && npm run compile
      - name: End-to-end tests
        working-directory: editors/vscode
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm test; else npm test; fi
      - name: Package the VSIX
        working-directory: editors/vscode
        run: npx --no-install vsce package --target ${{ matrix.platform }} --out lsp-mcpp-${{ matrix.platform }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.platform }}
          path: editors/vscode/lsp-mcpp-${{ matrix.platform }}.vsix
          retention-days: 7
